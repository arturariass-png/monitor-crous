name: Monitor CROUS

on:
  schedule:
    # Dues execucions garantides cada hora. La pausa aleatoria de sota
    # fa que l'hora real de consulta no sigui mai la mateixa.
    - cron: "8 * * * *"
    - cron: "38 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-crous
  cancel-in-progress: false

jobs:
  comprova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Espera aleatoria (0-15 min)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 900))

      - name: Comprova la disponibilitat
        env:
          URL: "https://mesrdv.lescrous.fr/fr/subjects/53f64a5e-5a91-11e8-9cb8-005056b0d91b"
          LIMIT: "2026-09-02 12:15"
          # Opcional: nomes cal si algun dia la web deixa de mostrar
          # el calendari sense identificar-se. Si no crees el secret,
          # aquesta linia queda buida i no passa res.
          COOKIE: ${{ secrets.COOKIE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py

      - name: Desa l'estat
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@github.com"
          git add estat.json || true
          git diff --staged --quiet || git commit -m "estat: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash || true
          git push || true
